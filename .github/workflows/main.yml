name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --warning-mode=none

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helloTT-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "🐆 helloTT v${{ github.run_number }}"
          files: app/build/outputs/apk/release/*.apk
          body: |
            🐆 helloTT — TikTok Mod Downloader
            Скачай APK ниже и установи на телефон.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
